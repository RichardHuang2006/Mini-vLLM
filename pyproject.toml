# Test harness configuration.
#
# Intentionally pytest-only. `pythonpath` puts the repo root on sys.path so
# tests can `import nanovllm` directly, which means there is no build or
# install step to repeat while iterating.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]

addopts = [
    "-ra",              # summary line for every non-passing test
    "--strict-markers", # an unregistered marker is an error, not a warning
    "--strict-config",  # a typo in this file is an error, not a warning
    "--showlocals",     # locals on failure; worth a lot when a tensor compare fails
    "--durations=10",
]

# Keep in sync with the "Test conventions" table in PLAN.md.
markers = [
    "gpu: requires a CUDA device; auto-skipped when unavailable",
    "oracle: requires HuggingFace weights on disk; set NANOVLLM_RUN_ORACLE=1 to enable",
    "slow: statistical or stress test taking minutes; deselect with -m 'not slow'",
]

xfail_strict = true
