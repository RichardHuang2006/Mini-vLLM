[project]
name = "mini-vllm"
version = "0.1.0"
description = "A paged-attention LLM inference engine for Apple silicon, on MLX and hand-written Metal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_vllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
