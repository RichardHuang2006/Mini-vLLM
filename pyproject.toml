[project]
name = "mini-vllm"
version = "0.1.0"
description = "A paged-attention LLM inference engine for Apple silicon, on MLX and hand-written Metal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.32.0",
    "mlx-lm>=0.31.3",
]

[dependency-groups]
dev = [
    "nanobind==2.15.0",
    "pytest>=8.3",
    "setuptools>=62",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# mini_vllm_ext is the Metal extension, built in place by src/extensions/build.py.
packages = ["src/mini_vllm", "src/extensions/mini_vllm_ext"]

[tool.hatch.build]
# An editable install puts both package roots on sys.path.
dev-mode-dirs = ["src", "src/extensions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["metal: runs a Metal kernel; build it first with uv run python src/extensions/build.py"]
