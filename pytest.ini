[pytest]
# Put the repo root on sys.path so tests import `mini_vllm` directly, with no
# install step and no per-test path hacking.
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    cuda: needs a CUDA device (skipped automatically when unavailable)
    oracle: needs the Qwen3-0.6B weights downloaded from HuggingFace
    slow: statistical or stress test, takes minutes
