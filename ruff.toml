# Correctness lint only. The source is hand-wrapped to be read, so there is no
# `ruff format` gate; none of the rules below rewrite layout.
line-length = 110
indent-width = 4
target-version = "py310"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # bugbear
    "UP",     # modern Python syntax
    "SIM",    # simplify code
    "RET",    # return statement consistency
    "RUF",    # Ruff-specific rules
]

# Wrapped "a b c".split() literals read better than the 300-character list
# SIM905 rewrites them into.
ignore = ["SIM905"]

# The error-norm docstrings spell ‖a − b‖ with a real minus sign, not a hyphen.
allowed-confusables = ["−"]

# The package re-exports each module's __all__ with star imports, as tiny-llm does.
[lint.per-file-ignores]
"src/mini_vllm/__init__.py" = ["F403"]
